name: Deploy Dist
on: [push, workflow_dispatch]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: GetCode
        uses: actions/checkout@v7
      - name: Install Node 20
        uses: actions/setup-node@v7 
        with:
          node-version: 20
      - name: Print Node version
        run: node -v
      - name: Install dependencies
        run: npm ci
      - name: Run test cases
        run: npm run test

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: GetCode
        uses: actions/checkout@v7
      - name: Install Node 20
        uses: actions/setup-node@v7 
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Build Project
        run: npm run build
      - name: Deploy
        run: echo "Deployed Successfully"
