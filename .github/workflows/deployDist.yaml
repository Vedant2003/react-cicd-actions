name: Deploy Dist

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths-ignore:
      - '.github/workflows/*'
      - 'README.md'
  workflow_dispatch:

jobs:

  # -------------------------
  # 1. TEST
  # -------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Print Node version
        run: node -v

      - name: Install dependencies
        run: npm ci

      - name: Run test cases
        run: npm run test


  # -------------------------
  # 2. BUILD
  # -------------------------
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Verify Dist Folder
        run: ls -la dist

      - name: Upload Dist Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist


  # -------------------------
  # 3. DEPLOY
  # -------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Dist Artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist

      - name: Verify Downloaded Artifact
        run: ls -la dist

      - name: Deploy
        run: echo "🚀 Deployed successfully"