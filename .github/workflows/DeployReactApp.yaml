name: Deploy React App

on:
  push:
    branches:
      - main
      - 'feature/**'
    paths-ignore:
      - '.github/workflows/*'
      - 'README.md'

  workflow_dispatch:

jobs:

  # -------------------------
  # 1. TEST
  # -------------------------
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Print Node version
        run: node -v

      - name: Install dependencies
        run: npm ci

      - name: Run test cases
        run: npm run test


  # -------------------------
  # 2. BUILD
  # -------------------------
  build:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Project
        run: npm run build

      - name: Verify Dist Folder
        run: ls -la dist

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: dist


  # -------------------------
  # 3. DEPLOY
  # -------------------------
  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4